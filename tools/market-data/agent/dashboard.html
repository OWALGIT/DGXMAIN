<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STOCKMIND · live book</title>
<style>
:root{--bg:#0a0d13;--panel:#131923;--panel2:#0f141d;--ink:#dbe3ec;--mut:#8593a2;--line:#242e3b;--grid:#1a232e;
 --acc:#e8b339;--eq:#4dd0e1;--pos:#3fb950;--neg:#f85149;--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;--sans:system-ui,-apple-system,"Segoe UI",Helvetica,sans-serif}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f7;--panel:#fff;--panel2:#eef1f4;--ink:#151a20;--mut:#5a6472;--line:#d6dae1;--grid:#e6e9ee;--acc:#b8860b;--eq:#0e7490;--pos:#1a7f37;--neg:#c4341c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:16px 18px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{font-family:var(--mono);font-weight:700;letter-spacing:.04em;font-size:16px}
.sim{font-family:var(--mono);font-size:10.5px;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:2px 9px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pos);box-shadow:0 0 0 0 var(--pos);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,185,80,.5)}70%{box-shadow:0 0 0 7px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}
.upd{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.kpi .v{font-family:var(--mono);font-size:20px;font-weight:650}.kpi .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:4px}
.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h2{margin:0 0 10px;font-size:13px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
svg{display:block;width:100%;height:auto}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:6px 7px;text-align:right;border-bottom:1px solid var(--grid)}th:first-child,td:first-child{text-align:left}
thead th{color:var(--mut);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--mut)}
.tag{font-size:9px;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--mut)}
.thesis{background:var(--panel2);border-left:2px solid var(--acc);border-radius:0 8px 8px 0;padding:9px 12px;font-size:13px;line-height:1.45;margin-top:8px}
.feed{max-height:230px;overflow:auto;font-family:var(--mono);font-size:11.5px}
.feed .r{display:grid;grid-template-columns:auto auto 1fr;gap:8px;padding:5px 2px;border-bottom:1px solid var(--grid)}
.mini{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.chip{font-family:var(--mono);font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:4px 9px;color:var(--mut)}.chip b{color:var(--ink)}
@media(max-width:840px){.kpis{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="top"><span class="dot"></span><span class="brand">STOCKMIND</span><span class="sim">PAPER · SIMULATION</span>
 <span class="mini" id="ctx"></span><span class="upd" id="upd">connecting…</span></div>
<div class="kpis" id="kpis"></div>
<div class="grid">
 <div class="card"><h2>Equity curve</h2><svg id="curve" viewBox="0 0 620 220"></svg>
  <div class="thesis" id="thesis"></div></div>
 <div class="card"><h2>Positions <span id="posn" class="mut"></span></h2><div style="overflow-x:auto"><table id="pos"><thead><tr><th>Ticker</th><th>Side</th><th>Wt%</th><th>Px</th><th>uPnL%</th><th>Value</th></tr></thead><tbody></tbody></table></div></div>
</div>
<div class="card" style="margin-top:14px"><h2>Decision feed</h2><div class="feed" id="feed"></div></div>
</div>
<script>
const $=s=>document.querySelector(s),f=(n,d=2)=>n==null?'–':(+n).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d});
const sg=(n,d=2)=>n==null?'–':(n>=0?'+':'')+(+n).toFixed(d);
function curve(el,pts){el.innerHTML='';if(!pts||pts.length<2){return}
 const W=620,H=220,pl=44,pr=10,pt=12,pb=20,xs=pts.map((_,i)=>i),ys=pts.map(p=>p.eq);
 const y0=Math.min(...ys),y1=Math.max(...ys),yr=(y1-y0)||1;
 const X=i=>pl+i/(pts.length-1)*(W-pl-pr),Y=v=>pt+(1-(v-y0)/yr)*(H-pt-pb);
 const svg='http://www.w3.org/2000/svg',mk=(n,a)=>{const e=document.createElementNS(svg,n);for(k in a)e.setAttribute(k,a[k]);return e};
 [0,.5,1].forEach(t=>{const v=y0+t*yr,y=Y(v);el.appendChild(mk('line',{x1:pl,y1:y,x2:W-pr,y2:y,stroke:'var(--grid)'}));
  const tx=mk('text',{x:pl-6,y:y+3,'text-anchor':'end','font-size':9,fill:'var(--mut)','font-family':'var(--mono)'});tx.textContent='$'+Math.round(v).toLocaleString();el.appendChild(tx)});
 let d='';pts.forEach((p,i)=>d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.eq).toFixed(1)+' ');
 const base=Y(pts[0].eq);
 el.appendChild(mk('path',{d:d+`L${X(pts.length-1)} ${H-pb} L${X(0)} ${H-pb} Z`,fill:'var(--eq)','fill-opacity':.08,stroke:'none'}));
 el.appendChild(mk('line',{x1:pl,y1:base,x2:W-pr,y2:base,stroke:'var(--mut)','stroke-dasharray':'3 3','stroke-width':.7}));
 el.appendChild(mk('path',{d,fill:'none',stroke:'var(--eq)','stroke-width':2}));
 el.appendChild(mk('circle',{cx:X(pts.length-1),cy:Y(pts[pts.length-1].eq),r:3.2,fill:'var(--eq)'}));}
async function tick(){
 let s;try{s=await(await fetch('/api/state',{cache:'no-store'})).json()}catch(e){$('#upd').textContent='offline';return}
 if(!s.ready){$('#upd').textContent=s.msg||'waiting';return}
 $('#upd').textContent='updated '+s.now.replace('T',' ').replace('Z',' UTC');
 const L=s.last||{};
 $('#ctx').innerHTML=`<span class="chip">breadth <b>${L.breadth??'–'}%</b></span><span class="chip">VIX <b>${L.VIX??'–'}</b></span><span class="chip">HYG/150 <b>${sg(L.HYG_vs150,1)}%</b></span><span class="chip">data <b>${L.asof||'–'}</b></span>`;
 const rc=s.ret_total_pct>=0?'pos':'neg';
 $('#kpis').innerHTML=[
  ['equity','$'+f(s.equity,0)],['return',`<span class="${rc}">${sg(s.ret_total_pct)}%</span>`],
  ['cash',s.cash_pct+'%'],['gross',s.gross_pct+'%'],['positions',s.n_pos],['cycles',s.cycles]
 ].map(k=>`<div class="kpi"><div class="v">${k[1]}</div><div class="k">${k[0]}</div></div>`).join('');
 curve($('#curve'),s.curve);
 $('#thesis').innerHTML=`<b style="font-family:var(--mono);color:var(--acc)">${L.brain||'–'}</b> · ${L.thesis||''}${L.risk?` <span class="mut">— ${L.risk}</span>`:''}`;
 $('#posn').textContent=`(${s.positions.length})`;
 $('#pos tbody').innerHTML=s.positions.map(p=>`<tr><td><b>${p.t}</b></td><td><span class="tag">${p.side}</span></td><td>${f(p.weight,1)}</td><td>${f(p.px)}</td><td class="${p.upnl>=0?'pos':'neg'}">${sg(p.upnl)}</td><td>$${f(p.value,0)}</td></tr>`).join('')||'<tr><td colspan=6 class=mut>flat</td></tr>';
 $('#feed').innerHTML=(s.feed||[]).map(r=>`<div class="r"><span class="mut">${(r.ts||'').slice(5,16).replace('T',' ')}</span><span style="color:var(--acc)">${(r.brain||'').slice(0,14)}</span><span>$${f(r.eq,0)} <span class="${r.ret>=0?'pos':'neg'}">${sg(r.ret)}%</span> · ${r.nf} fills · <span class="mut">${(r.thesis||'').slice(0,60)}</span></span></div>`).join('');
}
tick();setInterval(tick,20000);
</script></body></html>
